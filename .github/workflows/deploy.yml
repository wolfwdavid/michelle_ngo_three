name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
          standalone: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # D-17 grep gate (Phase 1 SC #3 "verifiable by grep")
      # Fails the build if any file under src/ — OTHER than the helper itself —
      # references `window.localStorage` or raw `localStorage.<method>`. The
      # helper $lib/storage.ts is the ONLY allowed point of contact with
      # window.localStorage; this gate makes drift mechanically impossible
      # (CONTEXT D-17 + specifics §helper-first storage rationale).
      - name: D-17 grep gate — no raw localStorage outside $lib/storage.ts
        run: |
          set -e
          # Search for raw localStorage usage in src/, excluding the helper file and its tests.
          # Patterns matched: `window.localStorage`, `localStorage.` (method call), `localStorage[`.
          matches=$(grep -rnE 'window\.localStorage|localStorage\.|localStorage\[' src/ \
            --include='*.ts' --include='*.svelte' --include='*.svelte.ts' \
            --exclude='storage.ts' --exclude='storage.test.ts' || true)
          if [ -n "$matches" ]; then
            echo "::error::D-17 grep gate failed — raw localStorage usage detected outside src/lib/storage.ts."
            echo "::error::All localStorage access must go through the typed \$lib/storage helper to enforce the mnp_three_ namespace (Trap D mitigation)."
            echo "::error::Offending lines:"
            echo "$matches"
            exit 1
          fi
          echo "D-17 grep gate passed — no raw localStorage usage outside the helper."

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm check

      - name: Unit tests (storage + intersectionVisibility + smoke-page)
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # E2E runs against an UNPREFIXED build so page.goto('/') resolves at root.
      # The deploy step below sets BASE_PATH for the actual GH Pages artifact;
      # keeping it OUT of this step is deliberate — see playwright.config.ts's
      # webServer comment for the matching rationale.
      - name: E2E + axe smoke tests
        run: pnpm test:e2e

      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          # Phase 7 (POL-01) will use this for sitemap + OG tags; for Phase 1 it's
          # defined for completeness so SvelteKit's import.meta.env reads it without
          # a runtime undefined error. Production cutover (FOUND-03) will override
          # in .github/workflows/deploy-production.yml (Phase 7).
          PUBLIC_SITE_URL: https://wolfwdavid.github.io/michelle_ngo_three
        run: pnpm build

      # Plan 07-04 / D-14 — prerender-coverage assertion.
      # adapter-static `strict: true` fails on a non-prerenderable route, but it
      # does NOT catch an EMPTY entries() enumeration (e.g. /watch/[id] yielding
      # zero ids → build succeeds with zero /watch HTML files). This script pins
      # the 70-URL sitemap + the 6 static routes + 8 categories + 56 watch pages +
      # the favicon/og-image binaries. Fails the build if any count is short.
      - name: Prerender coverage assertion (D-14 — 70-URL sitemap + static assets)
        run: node scripts/test-prerender-coverage.mjs

      # Plan 07-04 / Trap E (D-04) — route-manifest diff.
      # The A/B isolates DESIGN, not information architecture. This step proves
      # _three's prerendered route SHAPES match the committed snapshot of _four's
      # route IA (src/lib/data/.four-route-manifest, pinned at the same SHA as
      # .videos-source-sha). Committed-snapshot approach (RESEARCH Open Question 3)
      # — no need to build _four in CI; the drift-check job's __four/ checkout is
      # NOT required here. Refresh the manifest deliberately if _four's IA changes.
      - name: Trap E — route-manifest diff (D-04, _three IA must match _four)
        run: |
          set -e
          MANIFEST=src/lib/data/.four-route-manifest
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::Trap E — missing $MANIFEST. Plan 07-04 must commit the pinned _four route snapshot before this gate can run."
            exit 1
          fi
          # Enumerate _three's prerendered route shapes from build/, applying the
          # exact normalization documented in .four-route-manifest:
          #   strip /index.html, strip leading 'build', map empty root to '/',
          #   collapse /watch/<id> → /watch/* and /work/<slug> → /work/*,
          #   then sort | uniq -c | "<shape>\t<count>" | sort.
          BUILT=$(find build -name index.html \
            | sed 's|/index.html$||' \
            | sed 's|^build||' \
            | sed 's|^$|/|' \
            | sed -E 's|^/watch/.+$|/watch/*|' \
            | sed -E 's|^/work/.+$|/work/*|' \
            | sort | uniq -c | awk '{ printf "%s\t%d\n", $2, $1 }' | sort)
          # Strip comment + blank lines from the committed manifest, then sort.
          EXPECTED=$(grep -vE '^[[:space:]]*#' "$MANIFEST" | grep -vE '^[[:space:]]*$' | sort)
          if diff <(echo "$EXPECTED") <(echo "$BUILT"); then
            echo "Trap E passed — _three's prerendered route IA matches _four@07667658ee2fd16a3d56b66bbe832d08fc3badd5 ✓"
            exit 0
          fi
          echo "::error::Trap E — route IA divergence between _three and _four@07667658ee2fd16a3d56b66bbe832d08fc3badd5. The A/B isolates DESIGN, not IA. If _four's routes legitimately changed, re-sync src/lib/data/.four-route-manifest (refresh the route shapes + the pinned-SHA comment). Otherwise _three has a stray/missing prerendered route — fix the route tree."
          echo "::error::Diff (< expected from manifest, > actual from build/):"
          diff <(echo "$EXPECTED") <(echo "$BUILT") || true
          exit 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  drift-check:
    # DATA-04 / Trap A mitigation. Fails the workflow if src/lib/data/videos.json
    # has drifted from the _four commit pinned in src/lib/data/.videos-source-sha.
    # Runs on every PR and every push to main (D-10). Lives in this single workflow
    # file per D-11 (no separate drift-check.yml).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout _three
        uses: actions/checkout@v4

      - name: Read pinned _four SHA from sidecar
        id: pin
        run: |
          set -e
          SIDECAR=src/lib/data/.videos-source-sha
          if [ ! -f "$SIDECAR" ]; then
            echo "::error::Missing $SIDECAR — Plan 02-01 must create it before drift-check can run."
            exit 1
          fi
          FOUR_SHA=$(grep '^four_commit_sha=' "$SIDECAR" | cut -d= -f2)
          if [ -z "$FOUR_SHA" ] || [ ${#FOUR_SHA} -ne 40 ]; then
            echo "::error::Invalid four_commit_sha in $SIDECAR (expected 40-char hex, got: '$FOUR_SHA')"
            exit 1
          fi
          echo "four_sha=$FOUR_SHA" >> "$GITHUB_OUTPUT"
          echo "Pinned _four SHA: $FOUR_SHA"

      - name: Checkout _four at pinned SHA
        id: checkout_four
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: wolfwdavid/michelle_ngo_four
          ref: ${{ steps.pin.outputs.four_sha }}
          path: __four
          # Public repo — no token needed. fetch-depth: 1 is the default.

      - name: Handle unreachable _four SHA (D-07 force-push case)
        if: steps.checkout_four.outcome == 'failure'
        run: |
          echo "::error::_four@${{ steps.pin.outputs.four_sha }} no longer reachable. Re-sync from _four's current main and update src/lib/data/.videos-source-sha (refresh four_commit_sha, videos_json_sha256, synced_at)."
          exit 1

      - name: Byte-compare videos.json against pinned _four
        run: |
          set -e
          FOUR_FILE=__four/src/lib/data/videos.json
          THREE_FILE=src/lib/data/videos.json
          if [ ! -f "$FOUR_FILE" ]; then
            echo "::error::Expected $FOUR_FILE after checkout but it is missing. _four's repo structure may have changed."
            exit 1
          fi
          if cmp -s "$FOUR_FILE" "$THREE_FILE"; then
            echo "videos.json byte-identical to _four@${{ steps.pin.outputs.four_sha }} ✓"
            exit 0
          fi
          # D-12 failure message — EXACT wording (names file, names SHA, gives literal cp command):
          echo "::error::videos.json drift: src/lib/data/videos.json does not match _four@${{ steps.pin.outputs.four_sha }}. Re-sync: cp ../michelle_ngo_four/src/lib/data/videos.json src/lib/data/videos.json && update src/lib/data/.videos-source-sha (refresh four_commit_sha, videos_json_sha256, synced_at). Then commit and push."
          # Surface a short diff snippet for the PR reviewer (first 20 differing lines):
          diff -u "$FOUR_FILE" "$THREE_FILE" | head -40 || true
          exit 1

      - name: Verify sidecar sha256 matches the local file (catches accidental local edits)
        run: |
          set -e
          SIDECAR=src/lib/data/.videos-source-sha
          RECORDED=$(grep '^videos_json_sha256=' "$SIDECAR" | cut -d= -f2)
          ACTUAL=$(sha256sum src/lib/data/videos.json | awk '{print $1}')
          if [ "$RECORDED" != "$ACTUAL" ]; then
            echo "::error::Sidecar sha256 mismatch: $SIDECAR records videos_json_sha256=$RECORDED but the actual file's sha256 is $ACTUAL. Update the sidecar after editing videos.json (refresh videos_json_sha256 and synced_at)."
            exit 1
          fi
          echo "Sidecar sha256 consistent ✓"
