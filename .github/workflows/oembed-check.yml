name: oEmbed health-check

on:
  schedule:
    # Nightly at 06:00 UTC. Off-peak for both Vimeo (PT business hours) and
    # YouTube (most of US/EU asleep). Adjust if Vimeo/YouTube start returning
    # 5xx in this window (CONTEXT §Claude's Discretion on exact cron).
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  # gh issue create / comment / list needs issues:write.
  # Plus contents:read for checkout.
  contents: read
  issues: write

concurrency:
  # Only one embed-check at a time; cancel an in-flight run if a new one starts.
  group: oembed-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
          standalone: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run oEmbed check
        id: check
        continue-on-error: true
        run: pnpm check:embeds

      - name: Upload failure report (if any)
        if: steps.check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: embed-check-report
          path: .embed-check-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Auto-open or comment on tracked Issue (D-19)
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPORT=.embed-check-report.json
          if [ ! -f "$REPORT" ]; then
            echo "::warning::Check failed but $REPORT not found — embed-check script likely crashed (exit 2). Surfacing as a workflow failure."
            exit 1
          fi

          RAN_AT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$REPORT','utf8')).ranAt)")
          TOTAL=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$REPORT','utf8')).totalChecked)")
          FAIL_COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$REPORT','utf8')).failures.length)")

          # Render a Markdown table of failing records.
          FAILURE_TABLE=$(node -e "
            const r = JSON.parse(require('fs').readFileSync('$REPORT','utf8'));
            const rows = r.failures.map(f => \`| \${f.source} | \${f.id} | \${(f.title||'').replace(/\\|/g,'\\\\|')} | \${f.status ?? 'null'} | \${f.classification} |\`).join('\n');
            console.log('| source | id | title | status | classification |\n|---|---|---|---|---|\n' + rows);
          ")

          # D-19 body template.
          BODY=$(cat <<EOF
          **oEmbed health-check failure**

          - Ran at: \`$RAN_AT\`
          - Total checked: $TOTAL
          - Failures: $FAIL_COUNT
          - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ## Failing records

          $FAILURE_TABLE

          ## Next steps

          1. Verify the videos in the table manually (open the watch URL in an incognito window).
          2. If the owner has disabled embedding, either replace the video in \`videos.json\` (must round-trip through \`_four\` first per D-03) or accept the loss in coverage.
          3. If the failure is a Vimeo/YouTube outage (look for 5xx in the warnings list of the attached artifact), close this issue and rerun the workflow.
          4. The attached \`embed-check-report\` artifact has the full structured payload (failures + warnings).

          ---
          _Automated by \`.github/workflows/oembed-check.yml\` — Phase 2 D-19._
          EOF
          )

          # Detect an existing open issue (D-19: comment instead of duplicate).
          EXISTING=$(gh issue list --label embed-check --state open --json number --jq '.[0].number' || echo "")

          if [ -n "$EXISTING" ]; then
            echo "Found open embed-check issue #$EXISTING — adding comment."
            gh issue comment "$EXISTING" --body "$BODY"
          else
            echo "No open embed-check issue — creating new one."
            # Auto-create the label if it doesn't exist (idempotent).
            gh label create embed-check --description "oEmbed health-check tracking (Phase 2 D-19)" --color "d93f0b" --force 2>/dev/null || true
            gh issue create \
              --title "[embed-check] $FAIL_COUNT video(s) failed oEmbed check at $RAN_AT" \
              --label embed-check \
              --body "$BODY"
          fi

          # Surface failure to the workflow status.
          exit 1

      - name: Mark workflow failed if check failed
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::oEmbed check reported failures — see the auto-opened/commented Issue and the embed-check-report artifact."
          exit 1
